info:
  name: 02 GET shf_2 - only Marc
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/shifts/shf_2/available-agents"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the expected body", function () {
          expect(res.body).to.eql([{"id":"agt_3","name":"Marc Tremblay"}]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Expected: 200.

  Only Marc holds GUARD_LICENSE and CROWD_CONTROL; Jordan overlaps via shf_1 (22:00-06:00 vs 23:00-03:00).
